<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/main.css">
    <title>Register</title>
</head>
<body>
    
    <div class="container">
        <div class="center"><h2>CITY GENERAL HOSPITAL</h2></div>
        
        <div class="input-form">
            <form>
                <h3 class="center">Register As New User</h3>
                <table class="center">
                    <tr><td><label>Name :</label></td><td><input type="text" name="uname"></td></tr>
                    <tr><td><label>Email :</label></td><td><input type="email" name="uname"></td></tr>
                    <tr><td><label>Password :</label></td><td><input type="password" name="password"></td></tr>
                    <tr><td><label>User Type :</label></td><td><input type="text" name="utype"></td></tr>
                    <tr><td><label>Address :</label></td><td><input type="text" name="address"></td></tr>
                    <tr><td><input type="submit" value="Signup"></td><td><a href="#">Existing User ?</a></td></tr>
                </table>
                
                
                
                
            </form>
        </div>
    </div>
    
</body>
</html>
